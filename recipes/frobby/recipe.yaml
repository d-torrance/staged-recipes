context:
  version: "0.9.9"

package:
  name: frobby
  version: ${{ version }}

source:
  url: https://github.com/Macaulay2/frobby/releases/download/v${{ version }}/frobby_v${{ version }}.tar.gz
  sha256: 4c072c2ee208d853b7173921d45cc7d39297cf3f7fd9c8e7da8e482da3b51aa3

build:
  skip:
    - win
  script:
    - make -j${CPU_COUNT} all
    - make -j${CPU_COUNT} MODE=shared library
    - if: build_platform == target_platform
      then: make -j${CPU_COUNT} test
    - make PREFIX=$PREFIX install
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - gmp
  run_exports:
    - ${{ pin_subpackage('frobby', upper_bound='x') }}

tests:
  - package_contents:
      files:
        - include/frobby.h
      lib:
        - frobby
  - script:
      - frobby genideal | frobby irrdecom

about:
  homepage: https://numpi.dm.unipi.it/scientific-computing-libraries/mpsolve
  summary: 'computations with monomial ideals'
  description: |
    Frobby is a software system for computations with monomial
    ideals, intended for research in computational algebra. It
    supports Euler characteristics, Hilbert series, maximal standard
    monomials, combinatorial optimization, primary and irreducible
    decomposition, Alexander duals, associated primes, minimization
    and intersection of monomial ideals, and the computation of
    Frobenius problems with very large numbers.
  license: GPL-2.0-or-later
  license_file: COPYING
  documentation: https://macaulay2.com/Downloads/OtherSourceCode/manual.pdf
  repository: https://github.com/Macaulay2/frobby

extra:
  recipe-maintainers:
    - d-torrance
